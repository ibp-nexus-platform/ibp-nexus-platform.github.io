<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Nexus Platform</title>
<meta name="description" content="NEXUS — one data spine from 3D coordination to 4D planning, 5D cost and 6D digital twin">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>/* NEXUS Platform — "chalk downland" control-room palette.
   Layout: fixed top bar · module workspace = side panels around one shared 3D viewport. */
:root {
  --bg: #e9ede9; --panel: #ffffff; --panel-2: #f4f6f3; --panel-3: #eef1ed; --line: #d6ddd7; --line-2: #c3ccc4;
  --ink: #16211c; --mut: #5a6a62; --dim: #8a978f;
  --acc: #2e6a4d; --acc-2: #1f4d37; --acc-tint: #e0eee6; --acc-ink: #ffffff;
  --info: #2b67a8; --warn: #b8730b; --bad: #bf3a2b; --ok: #2f7d4f; --grey: #78837d;
  --bar: #14201a; --bar-ink: #e6efe9; --bar-mut: #93a79c;
  --sh: 0 1px 2px rgba(20,32,26,.08), 0 6px 18px rgba(20,32,26,.06);
  --r: 6px;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-cond: "IBM Plex Sans Condensed", "Arial Narrow", "IBM Plex Sans", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1512; --panel: #161e1a; --panel-2: #1b2520; --panel-3: #202b25; --line: #2a3630; --line-2: #36443c;
  --ink: #e4ece7; --mut: #95a69d; --dim: #6c7d74; --acc: #5cb48a; --acc-2: #7cc9a3; --acc-tint: #1d3329; --acc-ink: #0c1712;
  --info: #6aa7e6; --warn: #e3a33c; --bad: #ec7363; --ok: #63c08c; --grey: #8d9a93; --bar: #0a0f0c; --bar-ink: #e4ece7; --bar-mut: #84968c;
  --sh: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.25); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1512; --panel: #161e1a; --panel-2: #1b2520; --panel-3: #202b25; --line: #2a3630; --line-2: #36443c;
  --ink: #e4ece7; --mut: #95a69d; --dim: #6c7d74; --acc: #5cb48a; --acc-2: #7cc9a3; --acc-tint: #1d3329; --acc-ink: #0c1712;
  --info: #6aa7e6; --warn: #e3a33c; --bad: #ec7363; --ok: #63c08c; --grey: #8d9a93; --bar: #0a0f0c; --bar-ink: #e4ece7; --bar-mut: #84968c;
  --sh: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.25); color-scheme: dark; }

html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.45 var(--f-body); -webkit-font-smoothing: antialiased; overflow: hidden; }
#nexus { height: 100%; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 1px; }
.ic { width: 16px; height: 16px; fill: currentColor; flex: 0 0 auto; }
.lbl { font-family: var(--f-cond); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; font-size: 11px; color: var(--mut); }
.num, .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.num { font-size: 12px; }
.small { font-size: 12px; } .muted { color: var(--mut); } .block { display: block; } .grow { flex: 1 1 auto; } .nowrap { white-space: nowrap; }
.ok-t { color: var(--ok); } .warn-t { color: var(--warn); } .bad-t { color: var(--bad); }
.eyebrow { font-family: var(--f-cond); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; font-size: 11px; color: var(--acc); }
h1 { font: 600 24px/1.2 var(--f-cond); letter-spacing: -.005em; margin: 4px 0; text-wrap: balance; }
h2 { font: 600 14px/1.3 var(--f-cond); text-transform: uppercase; letter-spacing: .06em; margin: 0; }
h3 { font: 600 15px/1.3 var(--f-body); margin: 0 0 4px; } h4 { font: 600 12px/1.3 var(--f-cond); text-transform: uppercase; letter-spacing: .06em; color: var(--mut); margin: 14px 0 6px; }
.row { display: flex; align-items: center; gap: 6px; } .row.wrap { flex-wrap: wrap; } .row.between { justify-content: space-between; }
.pad { padding: 24px; }

/* ---------- app shell ---------- */
.app { height: 100%; display: flex; flex-direction: column; }
.topbar { flex: 0 0 auto; display: flex; align-items: center; gap: 14px; min-height: 50px; padding-block: 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--bar); color: var(--bar-ink); flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 6px; }
.brand b { font: 700 17px var(--f-cond); letter-spacing: .14em; }
.brand small { font: 500 11px var(--f-cond); text-transform: uppercase; letter-spacing: .1em; color: var(--bar-mut); }
.mark { display: inline-flex; gap: 2px; align-self: center; }
.mark i { width: 4px; height: 14px; background: #5cb48a; border-radius: 1px; transform: skewX(-14deg); }
.mark i:nth-child(2) { background: #2b78c5; height: 18px; margin-top: -4px; } .mark i:nth-child(3) { background: #e3a33c; }
.mark.big i { width: 9px; height: 34px; } .mark.big i:nth-child(2) { height: 42px; margin-top: -8px; }
.proj-btn .btn, .menu .btn.proj-btn { color: var(--bar-ink); }
.topbar .btn.ghost { color: var(--bar-ink); border-color: transparent; } .topbar .btn.ghost:hover { background: rgba(255,255,255,.08); }
.proj-name { max-width: 34ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block; vertical-align: bottom; }
.proj-name b { font-family: var(--f-mono); font-size: 12px; color: #5cb48a; margin-right: 4px; }
.modnav { display: flex; gap: 2px; margin-left: auto; overflow-x: auto; max-width: 100%; }
.modnav button { display: flex; align-items: baseline; gap: 6px; background: none; border: 0; color: var(--bar-mut); padding: 7px 12px; border-radius: 4px; cursor: pointer; border-bottom: 2px solid transparent; }
.modnav button:hover { color: var(--bar-ink); background: rgba(255,255,255,.05); }
.modnav button.on { color: var(--bar-ink); border-bottom-color: #5cb48a; background: rgba(92,180,138,.10); }
.modnav .dim { font: 700 15px var(--f-cond); letter-spacing: .04em; }
.modnav .ml { font: 500 12px var(--f-cond); text-transform: uppercase; letter-spacing: .06em; }
.envb { display: inline-flex; align-items: center; gap: 6px; font: 500 11px var(--f-cond); text-transform: uppercase; letter-spacing: .06em; color: var(--bar-mut); border: 1px solid rgba(255,255,255,.14); border-radius: 99px; padding: 3px 10px; }
.envb.shared { color: #8fd5b0; border-color: rgba(92,180,138,.5); } .envb em { font-style: normal; color: var(--bar-ink); text-transform: none; letter-spacing: 0; }
.work { flex: 1 1 auto; min-height: 0; position: relative; }
.viewer-park { position: fixed; left: -9999px; top: 0; width: 640px; height: 400px; }
.boot { position: fixed; inset: 0; background: var(--bar); color: var(--bar-ink); display: grid; place-content: center; justify-items: center; gap: 10px; z-index: 50; }
.boot b { font: 700 22px var(--f-cond); letter-spacing: .3em; } .boot span { color: var(--bar-mut); }
.busy { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--bar); color: var(--bar-ink); padding: 8px 16px; border-radius: 99px; display: flex; gap: 10px; align-items: center; z-index: 40; box-shadow: var(--sh); max-width: calc(100% - 32px); }
.spin { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.25); border-top-color: #5cb48a; border-radius: 50%; animation: sp .8s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
.toasts { pointer-events: none; position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: 20px; display: flex; flex-direction: column; gap: 6px; z-index: 60; max-width: min(460px, calc(100% - 32px)); }
.toast { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--info); padding: 9px 12px; border-radius: var(--r); box-shadow: var(--sh); }
.toast.ok { border-left-color: var(--ok); } .toast.warn { border-left-color: var(--warn); } .toast.error { border-left-color: var(--bad); }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; border-radius: 5px; border: 1px solid var(--line-2); background: var(--panel); color: var(--ink); cursor: pointer; white-space: nowrap; flex: 0 0 auto; }
.btn:hover { border-color: var(--acc); }
.btn.primary { background: var(--acc); color: var(--acc-ink); border-color: var(--acc); } .btn.primary:hover { background: var(--acc-2); }
.btn.ghost { background: transparent; border-color: transparent; } .btn.ghost:hover { background: var(--panel-3); border-color: var(--line); }
.btn.on { background: var(--acc-tint); border-color: var(--acc); color: var(--acc-2); }
.btn.danger, .btn.ghost.danger { color: var(--bad); }
.btn.sm { height: 26px; padding: 0 8px; font-size: 12px; } .btn.icon-only { padding: 0; width: 30px; justify-content: center; } .btn.sm.icon-only { width: 26px; }
.btn:disabled { opacity: .45; cursor: default; }
.inp { height: 30px; border: 1px solid var(--line-2); border-radius: 5px; background: var(--panel); padding: 0 8px; min-width: 0; width: 100%; }
textarea.inp { height: auto; padding: 6px 8px; resize: vertical; }
select.inp { padding-right: 4px; }
.inp.num { text-align: right; width: 84px; } .inp.lag { width: 58px; }
.row > .inp { width: auto; flex: 1 1 120px; }
.field { display: flex; flex-direction: column; gap: 3px; min-width: 0; } .field.wide { grid-column: 1 / -1; } .field small { color: var(--mut); font-size: 11px; }
.chk { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px 12px; align-items: start; }
.form-grid.tight { gap: 6px 8px; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
.form-col { display: flex; flex-direction: column; gap: 6px; }
.form-actions { display: flex; justify-content: flex-end; gap: 8px; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; flex: 0 0 auto; }
.tabs button { display: flex; align-items: center; gap: 6px; background: none; border: 0; padding: 9px 12px; color: var(--mut); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; font: 500 12px var(--f-cond); text-transform: uppercase; letter-spacing: .05em; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--acc); } .tabs button:hover { color: var(--ink); }
.tabs.sm button { padding: 8px 9px; }
.badge { font-style: normal; background: var(--bad); color: #fff; border-radius: 99px; padding: 0 6px; font: 600 10px var(--f-mono); }
.pill { display: inline-flex; align-items: center; border-radius: 99px; padding: 1px 8px; font: 600 11px var(--f-cond); letter-spacing: .03em; border: 1px solid var(--line-2); color: var(--mut); white-space: nowrap; }
.pill.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); background: color-mix(in srgb, var(--ok) 10%, transparent); }
.pill.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); background: color-mix(in srgb, var(--warn) 10%, transparent); }
.pill.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, transparent); background: color-mix(in srgb, var(--bad) 10%, transparent); }
.pill.info { color: var(--info); border-color: color-mix(in srgb, var(--info) 45%, transparent); background: color-mix(in srgb, var(--info) 10%, transparent); }
.pill.grey { color: var(--grey); }
.chip { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); background: var(--panel-2); border-radius: 4px; padding: 1px 7px; margin: 2px 4px 2px 0; font-size: 12px; }
.btnchip { cursor: pointer; } .btnchip.on { background: var(--acc-tint); border-color: var(--acc); color: var(--acc-2); }
.chips { display: flex; flex-wrap: wrap; gap: 2px; margin: 4px 0; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: middle; } .sw.red { background: #d62828; } .sw.green { background: #29a84d; }
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; color: var(--mut); padding: 32px 18px; max-width: 64ch; margin: 0 auto; }
.empty .ic { color: var(--acc); } .empty b { color: var(--ink); font-size: 15px; } .empty .row { justify-content: center; flex-wrap: wrap; margin-top: 8px; }
.kpis { display: flex; flex-wrap: wrap; gap: 8px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 7px 12px; min-width: 120px; display: flex; flex-direction: column; }
.kpi b { font-size: 18px; font-weight: 500; } .kpi small { color: var(--mut); font-size: 11px; }
.kpi.warn b { color: var(--warn); } .kpi.bad b { color: var(--bad); } .kpi.ok b { color: var(--ok); }
.kpis.small .kpi { padding: 4px 10px; min-width: 100px; } .kpis.small .kpi b { font-size: 15px; }
.menu { position: relative; display: inline-flex; }
.menu-pop { position: absolute; top: calc(100% + 4px); left: 0; z-index: 30; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--sh); min-width: 240px; padding: 4px; max-height: 70vh; overflow: auto; }
.vtool .menu-pop, .topright .menu-pop { left: auto; right: 0; }
.menu-pop button { display: flex; align-items: center; gap: 8px; width: 100%; background: none; border: 0; padding: 7px 8px; border-radius: 4px; text-align: left; cursor: pointer; }
.menu-pop button:hover { background: var(--panel-3); } .menu-pop button small { margin-left: auto; color: var(--mut); } .menu-pop button.danger { color: var(--bad); }
.menu-pop hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; } .menu-head { padding: 6px 8px 2px; font: 600 11px var(--f-cond); text-transform: uppercase; letter-spacing: .06em; color: var(--mut); }
.modal-bg { position: fixed; inset: 0; background: rgba(10,16,13,.45); display: grid; place-items: center; z-index: 45; padding: 16px; }
.modal { background: var(--panel); border-radius: 8px; box-shadow: var(--sh); width: min(560px, 100%); max-height: calc(100vh - 32px); display: flex; flex-direction: column; border: 1px solid var(--line); }
.modal.wide { width: min(980px, 100%); }
.modal header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.modal header h3 { margin: 0; font: 600 16px var(--f-cond); }
.modal-body { padding: 14px 16px; overflow: auto; display: flex; flex-direction: column; gap: 10px; }
.modal footer { display: flex; gap: 8px; justify-content: flex-end; padding: 10px 16px; border-top: 1px solid var(--line); }
.sec { border-bottom: 1px solid var(--line); } .sec > header { display: flex; align-items: center; gap: 6px; padding: 8px 2px; cursor: pointer; } .sec > header .r { margin-left: auto; } .sec-body { padding: 0 2px 10px; }
.kv { display: grid; grid-template-columns: minmax(90px, 40%) 1fr; gap: 3px 10px; margin: 0; }
.kv dt { color: var(--mut); font-size: 12px; overflow-wrap: anywhere; } .kv dd { margin: 0; overflow-wrap: anywhere; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card-h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.tbl-wrap { overflow: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); min-height: 0; }
.tbl { border-collapse: collapse; width: 100%; } .tbl th, .tbl td { padding: 5px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
.tbl thead th { position: sticky; top: 0; background: var(--panel-2); font: 600 11px var(--f-cond); text-transform: uppercase; letter-spacing: .05em; color: var(--mut); z-index: 1; white-space: nowrap; }
.tbl tfoot td { background: var(--panel-2); font-weight: 600; position: sticky; bottom: 0; }
.tbl .r, .r { text-align: right; } .tbl tr.click { cursor: pointer; } .tbl tr.click:hover td { background: var(--panel-3); } .tbl tr.on td { background: var(--acc-tint); }
.tbl tr.grp td { background: var(--panel-3); font: 600 12px var(--f-cond); text-transform: uppercase; letter-spacing: .05em; } .tbl tr.sub td { color: var(--mut); font-style: italic; } .tbl tr.total td { font-size: 14px; }
.tbl.small td, .tbl.small th { padding: 3px 6px; font-size: 12px; } .tbl td .inp { height: 26px; }
.heat { background: color-mix(in srgb, var(--acc) calc(var(--h) * 55%), transparent); }
.link { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; color: var(--ink); } .link:hover b { color: var(--acc); text-decoration: underline; }
.vlist { overflow: auto; position: relative; } .vrow { display: flex; align-items: stretch; }

/* charts */
.chart { width: 100%; display: block; } .chart .grid { stroke: var(--line); stroke-width: 1; } .chart .axis { fill: var(--mut); font: 10px var(--f-cond); }
.chart .line { fill: none; stroke: var(--c); stroke-width: 2; vector-effect: non-scaling-stroke; } .chart .line.dash { stroke-dasharray: 5 4; }
.chart .area { fill: var(--c); opacity: .12; } .chart .dot { fill: var(--c); } .chart .marker { stroke: var(--warn); stroke-dasharray: 3 3; }
.chart-empty { color: var(--mut); padding: 20px; text-align: center; }
.bars { display: flex; flex-direction: column; gap: 4px; } .bar-row { display: grid; grid-template-columns: minmax(120px, 34%) 1fr auto; gap: 8px; align-items: center; }
.bar-row .bl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; } .bar-row .bt { height: 10px; background: var(--panel-3); border-radius: 2px; overflow: hidden; } .bar-row .bt i { display: block; height: 100%; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; } .legend span { display: inline-flex; align-items: center; gap: 6px; }

/* ---------- workspaces ---------- */
.ws { position: absolute; inset: 0; display: grid; min-height: 0; }
.ws.three { grid-template-columns: var(--lw, 290px) 7px minmax(0, 1fr) 7px var(--rw, 390px); }
.ws.plan { grid-template-columns: minmax(0, 1fr) 340px; }
.ws.cost, .ws.assets { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
.ws.split2 { grid-template-columns: var(--mw, minmax(0, 1fr)) 7px var(--vw, 42%); }
.panel { background: var(--panel); border-color: var(--line); border-style: solid; border-width: 0; display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.panel.left { border-right-width: 1px; } .panel.right { border-left-width: 1px; }
.panel-body { flex: 1 1 auto; overflow: auto; padding: 10px; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
.center { display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; }
.viewer-wrap { position: relative; flex: 1 1 auto; min-height: 0; }
.viewer-slot { position: absolute; inset: 0; }
.nx-viewer { position: absolute; inset: 0; overflow: hidden; } .nx-viewer canvas { width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
.nx-overlay { position: absolute; inset: 0; pointer-events: none; }
.nx-pin { position: absolute; left: 0; top: 0; pointer-events: auto; margin: -11px 0 0 -11px; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; border: 2px solid #fff; background: var(--info); color: #fff; font: 600 11px var(--f-mono); cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,.35); white-space: nowrap; }
.nx-pin.clash.new { background: #c0392b; } .nx-pin.clash.active { background: #c77c12; } .nx-pin.clash.reviewed { background: #2b67a8; } .nx-pin.clash.approved { background: #6b7a72; }
.nx-pin.issue { background: #7048e8; border-radius: 4px; } .nx-pin.issue.resolved, .nx-pin.issue.closed { background: #2f7d4f; }
.nx-pin.sensor { background: #1f6f54; border-radius: 4px; } .nx-pin.sensor.amber { background: #c77c12; } .nx-pin.sensor.red { background: #c0392b; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: .55; } } @media (prefers-reduced-motion: reduce) { .nx-pin.sensor.red { animation: none; } }
.vtool { display: flex; gap: 6px; padding: 6px 8px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; flex: 0 0 auto; }
.vtool .grp { display: flex; gap: 1px; padding-right: 6px; border-right: 1px solid var(--line); } .vtool .grp:last-child { border-right: 0; }
.vtool.compact { padding: 4px 6px; gap: 4px; }
.hud { position: absolute; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; background: rgba(16,24,20,.86); color: #eef5f0; padding: 6px 12px; border-radius: 6px; font-size: 12px; max-width: calc(100% - 24px); }
.hud.measure { bottom: 14px; } .hud.walk { top: 12px; } .hud.sel { bottom: 14px; left: 14px; transform: none; } .hud .btn.ghost { color: #eef5f0; } .hud small { color: #b7c9bf; }

.clist { flex: 1 1 260px; min-height: 200px; border: 1px solid var(--line); border-radius: var(--r); overflow: auto; }

.alert.amber { border-color: var(--warn); color: var(--warn); background: color-mix(in srgb, var(--warn) 8%, transparent); } .alert.red { border-color: var(--bad); color: var(--bad); background: color-mix(in srgb, var(--bad) 8%, transparent); } .alert span { color: var(--ink); }

.k4d { grid-template-columns: repeat(6, minmax(0, 1fr)); }

/* ---------------- window manager: dock · float · maximise · own window · hide ---------------- */
.pane-dock { position: relative; }

.pane-ctl button:hover { background: var(--panel-3); color: var(--acc); }
.plan-3d.pane-dock > .pane-ctl, .center.pane-dock > .pane-ctl { top: auto; bottom: 8px; right: 10px; }
.wide-viewer.pane-dock > .pane-ctl { top: auto; bottom: 8px; right: 10px; }

.pane-ph { display: grid; justify-items: center; gap: 6px; text-align: center; color: var(--mut); padding: 14px; font-size: 12.5px; }

.pwin { position: fixed; display: flex; flex-direction: column; min-width: 240px; min-height: 140px; background: var(--panel); border: 1px solid var(--line-2, var(--line)); border-radius: 8px; box-shadow: 0 18px 48px rgba(0,0,0,.38), 0 2px 8px rgba(0,0,0,.25); overflow: hidden; }

.pwin-h { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 6px 0 10px; background: var(--panel-3); border-bottom: 1px solid var(--line); cursor: move; user-select: none; font-size: 12.5px; }
.pwin-h b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.pane-gone { overflow: hidden; border: 0 !important; padding: 0 !important; min-width: 0; }
.pane-gone > * { display: none; }
.pwin-b { flex: 1 1 auto; min-height: 0; overflow: auto; position: relative; display: flex; flex-direction: column; }

.pwin-b.plan-3d, .pwin-b.plan-bottom { min-height: 0; flex: 1 1 auto; }
.rz { position: absolute; z-index: 5; }

.rz.e, .rz.w { top: 8px; bottom: 8px; width: 7px; cursor: ew-resize; } .rz.e { right: -3px; } .rz.w { left: -3px; }
.rz.ne, .rz.nw, .rz.se, .rz.sw { width: 14px; height: 14px; } .rz.ne { top: -4px; right: -4px; cursor: nesw-resize; } .rz.sw { bottom: -4px; left: -4px; cursor: nesw-resize; }
.rz.nw { top: -4px; left: -4px; cursor: nwse-resize; } .rz.se { bottom: -4px; right: -4px; cursor: nwse-resize; }

/* ---------------------------------------------------------------- corridor designer */
.ws.rd { grid-template-columns: var(--lw, 360px) 7px minmax(0, 1fr); }
.rd-main { background: var(--bg); }
.rd-bar { display: flex; align-items: center; gap: 4px; padding: 5px 8px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
.rd-bar .sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
.rd-bar .grow, .rd-status .grow { flex: 1 1 auto; }
.rd .seg { display: inline-flex; gap: 0; } .rd .seg button { padding: 4px 9px !important; border-radius: 0; font-size: 12px; margin-left: -1px; }
.rd .seg button:first-child { border-radius: 4px 0 0 4px; } .rd .seg button:last-child { border-radius: 0 4px 4px 0; }
.rd .seg.sm button { padding: 2px 7px !important; font-size: 11px; }
.rd-top, .rd-bot { display: flex; min-height: 0; min-width: 0; }
.rd-top { flex: 0 0 50%; } .rd-bot { flex: 1 1 0; min-height: 140px; }
.rd-top > .splitter { flex: 0 0 7px; }
.rd-view { display: flex; flex-direction: column; min-width: 0; min-height: 0; flex: 1 1 0; background: var(--panel); border-right: 1px solid var(--line); position: relative; }
.rd-bot > .rd-view:first-child { flex: 1.6 1 0; }
.rd-vh { display: flex; align-items: center; gap: 6px; padding: 4px 8px; font-size: 11px; letter-spacing: .04em; color: var(--mut); border-bottom: 1px solid var(--line); min-height: 28px; }
.rd-vh b { color: var(--ink); font-weight: 700; margin-right: auto; }
.rd-vh button, .rd-vh select { font-size: 11px; padding: 2px 7px; border: 1px solid var(--line); background: var(--panel-2); border-radius: 4px; color: var(--ink); cursor: pointer; }
.rd-vh button.on { border-color: var(--acc); color: var(--acc-2); }
.cv-wrap { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; }
.cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
.cv.mode-add { cursor: copy; } .cv.mode-del { cursor: not-allowed; }
.rd-3d .viewer-wrap { flex: 1 1 auto; }
.rd-layers { position: absolute; right: 8px; top: 8px; z-index: 5; background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; display: flex; flex-direction: column; gap: 3px; font-size: 11.5px; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
.rd-layers label { display: flex; align-items: center; gap: 6px; cursor: pointer; } .rd-layers .vx { margin-top: 4px; padding-top: 5px; border-top: 1px solid var(--line); justify-content: space-between; }
.rd-layers select { font-size: 11px; }
.rd-slide { display: flex; align-items: center; gap: 6px; padding: 5px 8px; border-top: 1px solid var(--line); }
.rd-slide input[type=range] { flex: 1 1 auto; } .rd-slide button { border: 1px solid var(--line); background: var(--panel-2); border-radius: 4px; padding: 1px 7px; cursor: pointer; color: var(--ink); }
.rd-slide b { font-size: 12px; min-width: 72px; text-align: right; }
.rd-status { display: flex; align-items: center; gap: 14px; padding: 4px 10px; font-size: 11.5px; border-top: 1px solid var(--line); background: var(--panel); color: var(--mut); white-space: nowrap; overflow: hidden; }
.rd-status .ok { color: var(--ok, #2e9d5b); font-weight: 600; } .rd-status .bad { color: var(--warn, #d08a00); font-weight: 600; }
.rd-empty { flex: 1 1 auto; display: grid; place-items: center; } .rd-empty .empty { max-width: 520px; text-align: center; gap: 10px; } .rd-empty .row { justify-content: center; }
.rd-side .h6 { font-size: 10.5px; letter-spacing: .07em; font-weight: 700; color: var(--mut); margin-top: 6px; }
.rd-tab { display: flex; flex-direction: column; gap: 7px; }
.rd-tab .tbl { width: 100%; border-collapse: collapse; font-size: 11.5px; }
.rd-tab .tbl th { text-align: left; font-weight: 600; color: var(--mut); padding: 3px 3px; border-bottom: 1px solid var(--line); font-size: 10.5px; white-space: nowrap; }
.rd-tab .tbl td { padding: 2px 3px; border-bottom: 1px solid var(--line); } .rd-tab .tbl td.r, .rd-tab .tbl th.r { text-align: right; }
.rd-tab .tbl tr.sel td { background: var(--acc-tint); }
.rd-tab input.cell { width: 100%; min-width: 0; font: 11.5px var(--mono, ui-monospace, monospace); padding: 2px 4px; border: 1px solid var(--line); background: var(--panel-2); color: var(--ink); border-radius: 3px; }
.rd-pi td:first-child { width: 36px; font-size: 11px; } .rd-pi button.x { border: 0; background: none; color: var(--mut); cursor: pointer; font-size: 14px; } .rd-pi button.x:hover:not(:disabled) { color: var(--bad, #d33); }
.rd-el .sw { display: inline-block; width: 10px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
.rd-card { border: 1px solid var(--line); background: var(--panel-2); border-radius: 5px; padding: 7px 9px; line-height: 1.5; }
.rd-issues { color: var(--warn, #d08a00); font-size: 12px; } .rd-ok { color: var(--ok, #2e9d5b); font-size: 12px; font-weight: 600; }
.rd-tab .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 8px; }
.rd-tab .kv2 { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 12.5px; } .rd-tab .kv2 span { color: var(--mut); }
.rd-tab ul { margin: 0; padding-left: 18px; line-height: 1.55; }
@media (max-width: 900px) { .ws.rd { grid-template-columns: 1fr; grid-template-rows: auto 1fr; } .ws.rd > .splitter { display: none; } .rd-top { flex-direction: column; } }
.rd .rd-view.pane-dock > .pane-ctl { top: 34px; left: 6px; right: auto; }
.rd .panel.left.pane-dock > .pane-ctl { top: auto; bottom: 6px; right: 8px; }
.rd .panel.left .tabs { flex-wrap: wrap; overflow: visible; } .rd .panel.left .tabs button { padding: 7px 8px; }

/* ---------------------------------------------------------------- 4D authoring (SYNCHRO 4D Pro-style) */
.ws.s4 { display: flex; flex-direction: column; outline: none; background: var(--bg); }
.ws4r { position: absolute; inset: 0; display: flex; flex-direction: column; }

.ribbon { flex: 0 0 auto; background: var(--panel); border-bottom: 1px solid var(--line); }
.rtabs2 { display: flex; align-items: flex-end; gap: 1px; padding: 0 8px; background: var(--panel-2); border-bottom: 1px solid var(--line); }
.rtabs2 button { border: 0; background: none; padding: 7px 14px 6px; font: 600 12px var(--f-cond); letter-spacing: .04em; text-transform: uppercase; color: var(--mut); cursor: pointer; border-bottom: 2px solid transparent; }
.rtabs2 button.on { color: var(--ink); background: var(--panel); border-bottom-color: #e8590c; }
.rtabs2 button:last-of-type { color: #e8590c; }
.rtabs2 .rsearch { width: 220px; height: 26px; margin: 3px 0; }
.rbody { display: flex; align-items: stretch; gap: 0; padding: 4px 6px 2px; overflow-x: auto; min-height: 74px; }
.rg { display: flex; flex-direction: column; border-right: 1px solid var(--line); padding: 0 6px; flex: 0 0 auto; }
.rg-b { display: flex; gap: 2px; align-items: flex-start; flex: 1 1 auto; }
.rg-l { font: 600 10px var(--f-cond); text-transform: uppercase; letter-spacing: .06em; color: var(--dim); text-align: center; padding: 2px 0 1px; }
.rb { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 2px; min-width: 52px; max-width: 78px; padding: 4px 4px 3px; border: 1px solid transparent; border-radius: 5px; background: none; cursor: pointer; color: var(--ink); font-size: 11px; line-height: 1.15; text-align: center; }
.rb:hover:not(:disabled) { background: var(--panel-3); border-color: var(--line); }
.rb.on { background: var(--acc-tint); border-color: var(--acc); color: var(--acc-2); }
.rb:disabled { opacity: .4; cursor: default; }
.rb .ic { width: 18px; height: 18px; color: var(--acc); } .rbt { font: 700 13px var(--f-mono); color: var(--acc); height: 18px; line-height: 18px; }
.rcol { display: flex; flex-direction: column; gap: 3px; font-size: 11.5px; padding-top: 2px; } .rl { display: flex; align-items: center; gap: 6px; justify-content: space-between; } .rl select { font-size: 11.5px; }
.rnote { max-width: 340px; font-size: 11px; color: var(--mut); line-height: 1.35; padding: 2px 4px; }
.s4-main { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
.s4-top { display: flex; min-height: 0; }
.s4-3d { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; background: var(--panel); }
.s4-top > .splitter { flex: 0 0 7px; }
.s4-side { flex: 0 0 auto; min-width: 0; display: flex; flex-direction: column; background: var(--panel); border-left: 1px solid var(--line); overflow: hidden; }
.s4-side.collapsed > * { display: none; }
.s4-sb { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 8px 10px; }
.s4-gantt { flex: 1 1 0; min-height: 120px; display: flex; flex-direction: column; background: var(--panel); border-top: 1px solid var(--line); }
.s4-gantt > .empty { margin: auto; }
.s4-status { flex: 0 0 auto; display: flex; gap: 16px; align-items: center; padding: 3px 10px; font-size: 11.5px; background: var(--panel-2); border-top: 1px solid var(--line); white-space: nowrap; overflow: hidden; color: var(--mut); }
.s4-status b { color: var(--ink); } .s4-status .grow { flex: 1 1 auto; }
.s4-focus { flex: 0 0 auto; display: flex; align-items: center; gap: 3px; padding: 4px 8px; background: var(--panel-2); border-top: 1px solid var(--line); }
.s4-focus button { width: 28px; height: 26px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); color: var(--ink); cursor: pointer; }
.s4-focus button.play { background: #e8590c; color: #fff; border-color: #e8590c; } .s4-focus button.txt { width: auto; padding: 0 7px; font: 600 11px var(--f-mono); }
.s4-focus .fdate { width: 140px; height: 26px; } .s4-focus .frange { flex: 1 1 auto; accent-color: #e8590c; } .s4-focus select { height: 26px; } .s4-focus .fd { font: 500 12px var(--f-mono); min-width: 150px; text-align: right; }
.s4-date { position: absolute; left: 10px; top: 10px; z-index: 3; background: rgba(16,24,20,.86); color: #eef5f0; border-radius: 6px; padding: 7px 11px; border-left: 4px solid #e8590c; display: flex; flex-direction: column; gap: 1px; pointer-events: none; max-width: 60%; }
.s4-date .lbl { color: #9fb3a8; font-size: 10px; } .s4-date b { font-size: 18px; font-weight: 600; } .s4-date small { color: #c9d6cf; font-size: 11.5px; } .s4-date .sw { width: 9px; height: 9px; margin: 0 2px 0 6px; }
/* gantt window */
.pg { flex: 1 1 auto; min-height: 0; display: flex; }
.pg-grid { flex: 0 0 auto; display: flex; flex-direction: column; min-width: 0; overflow: hidden; border-right: 1px solid var(--line); }
.pg-gh { height: 38px; flex: 0 0 auto; display: grid; align-items: end; background: var(--panel-2); border-bottom: 1px solid var(--line); font: 600 10.5px var(--f-cond); text-transform: uppercase; letter-spacing: .04em; color: var(--mut); overflow: hidden; }
.pg-gh span, .pg-row > span { padding: 0 5px 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .pg-gh .r, .pg-row .r { text-align: right; }
.pg-gb { flex: 1 1 auto; min-height: 0; overflow: hidden; position: relative; }
.pg-row { position: absolute; left: 0; right: 0; height: 24px; display: grid; align-items: center; font-size: 12px; border-bottom: 1px solid rgba(128,140,134,.12); cursor: default; user-select: none; }

.pg-row:hover { background: var(--panel-3); } .pg-row.sel { background: color-mix(in srgb, var(--acc) 18%, var(--panel)); } .pg-row.hi:not(.sel) { background: color-mix(in srgb, #ffbe3c 18%, var(--panel)); }
.pg-row.wbs { font-weight: 600; background: color-mix(in srgb, var(--panel-3) 70%, var(--panel)); } .pg-row.wbs.sel { background: color-mix(in srgb, var(--acc) 22%, var(--panel)); }

.pg-row .ty { width: 8px; height: 8px; border-radius: 2px; background: #7d8b95; flex: 0 0 auto; } .pg-row .ty.lk { background: #2b67a8; } .pg-row .ty.ms { transform: rotate(45deg); background: var(--ink); border-radius: 1px; }
.pg-in { width: 100%; height: 22px; font: inherit; border: 1px solid var(--acc); border-radius: 3px; padding: 0 4px; background: var(--panel); color: var(--ink); }
.pg-split { flex: 0 0 5px; cursor: col-resize; background: var(--panel-2); } .pg-split:hover { background: var(--acc-tint); }
.pg-chart { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
.pg-hd { flex: 0 0 38px; display: block; cursor: pointer; border-bottom: 1px solid var(--line); }
.pg-sc { flex: 1 1 auto; min-height: 0; overflow: auto; position: relative; }
.pg-cv { position: sticky; left: 0; top: 0; display: block; }
/* side panels */
.s4-pp .h6, .pp-b .h6, .r3 .h6 { font: 700 10.5px var(--f-cond); letter-spacing: .07em; color: var(--mut); margin: 8px 0 3px; }
.s4-pp { display: flex; flex-direction: column; gap: 6px; }
.pp-h { display: flex; align-items: center; gap: 8px; } .pp-h b { font: 600 13px var(--f-mono); color: var(--acc); } .pp-h span { flex: 1 1 auto; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pp-b { display: flex; flex-direction: column; gap: 7px; padding-top: 6px; }
.pp-b .grid2, .s4-pp .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 8px; }
.pp-b .kv2, .s4-pp .kv2 { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 12px; } .kv2 span { color: var(--mut); }
.pp-b .tbl td.nm, .r3 .nm { max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.inp.sm { height: 24px; font-size: 12px; padding: 0 5px; } .inp.sm.num { width: 64px; text-align: right; }
.tbl .x, .pp-b .x { border: 0; background: none; color: var(--mut); cursor: pointer; font-size: 14px; } .tbl .x:hover { color: var(--bad); }
.qbig { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; background: var(--panel-2); } .qbig b { font: 600 18px var(--f-mono); } .qbig small { color: var(--mut); }
.r3 { display: flex; flex-direction: column; gap: 6px; } .r3 .inp.sm { width: auto; flex: 1 1 90px; }
.r3-tree { border: 1px solid var(--line); border-radius: 5px; max-height: 46vh; overflow: auto; padding: 3px 0; }
.r3-row { display: flex; align-items: center; gap: 4px; padding: 1px 6px; font-size: 12px; } .r3-row:hover { background: var(--panel-3); } .r3-row.on { background: var(--acc-tint); }
.r3-row .tw { border: 0; background: none; width: 14px; padding: 0; cursor: pointer; color: var(--mut); }
.r3-row .nm { flex: 1 1 auto; border: 0; background: none; text-align: left; cursor: pointer; padding: 2px 0; color: var(--ink); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: none; }
.r3-row small { color: var(--mut); font: 11px var(--f-mono); } .r3-row small.as { color: var(--info); } .r3-row small.un { color: var(--dim); }
.r3-c { margin-left: 12px; } .r3-row.e { margin-left: 26px; }

.r3-d { border-top: 1px solid var(--line); padding-top: 4px; } .r3-d .link { font-size: 12px; }
.tbl.lib tr.on td { background: var(--acc-tint); } .tbl.prof input[type=color] { width: 36px; height: 22px; padding: 0; border: 1px solid var(--line); }
.hist { display: block; border: 1px solid var(--line); border-radius: 5px; }
@media (max-width: 900px) { .s4-top { flex-direction: column; } .s4-side { width: auto !important; max-height: 50vh; } .pg-grid { width: 46% !important; } }
.s4-side.pane-dock > .pane-ctl { top: auto; bottom: 6px; right: 8px; }
.s4-gantt.pane-dock > .pane-ctl { top: auto; bottom: 6px; right: 18px; }
.s4-3d.pane-dock > .pane-ctl { top: auto; bottom: 8px; right: 10px; }
.r3-m.hid > .r3-row.m { opacity: .55; }
.pg, .ribbon, .s4-focus, .s4-status { user-select: none; -webkit-user-select: none; }
.pg-in { user-select: text; -webkit-user-select: text; }
.s4-sb .tbl { table-layout: fixed; width: 100%; }
.s4-sb .tbl td, .s4-sb .tbl th { padding: 3px 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.s4-sb .tbl .inp.sm, .s4-sb .tbl td select.inp, .s4-sb .tbl select { width: 100%; min-width: 0; }
.s4-sb .tbl th:last-child, .s4-sb .tbl td:last-child { width: 24px; }
.tbl.lib th:nth-child(1) { width: 34%; } .tbl.lib th:nth-child(2) { width: 22%; } .tbl.lib th:nth-child(3) { width: 16%; } .tbl.lib th:nth-child(4) { width: 15%; } .tbl.lib th:nth-child(5) { width: 11%; }
.tbl.prof th:nth-child(1) { width: 22%; } .tbl.prof th:nth-child(3) { width: 16%; } .tbl.prof th:nth-child(4) { width: 15%; } .tbl.prof th:last-child, .tbl.prof td:last-child { width: auto; }
.tbl.rel th:nth-child(1) { width: 26%; } .tbl.rel th:nth-child(3) { width: 58px; } .tbl.rel th:nth-child(4) { width: 52px; }

/* ---------------------------------------------------------------- live collaboration */
.livebar { display: inline-flex; align-items: center; gap: 8px; }
.livep { display: inline-flex; align-items: center; gap: 6px; font: 700 11px var(--f-cond); letter-spacing: .08em; padding: 3px 9px; border-radius: 99px; border: 1px solid rgba(255,255,255,.2); color: var(--bar-mut); }
.livep i { width: 8px; height: 8px; border-radius: 50%; background: #8a978f; }
.livep.on { color: #8fe0b4; border-color: rgba(92,180,138,.55); } .livep.on i { background: #3ddc84; box-shadow: 0 0 0 0 rgba(61,220,132,.7); animation: livepulse 1.8s infinite; }
.livep.off { color: #ffb4a8; border-color: rgba(236,115,99,.6); } .livep.off i { background: #ec7363; }
@keyframes livepulse { 0% { box-shadow: 0 0 0 0 rgba(61,220,132,.6); } 70% { box-shadow: 0 0 0 7px rgba(61,220,132,0); } 100% { box-shadow: 0 0 0 0 rgba(61,220,132,0); } }

.rolep { font: 700 10.5px var(--f-cond); letter-spacing: .07em; padding: 3px 8px; border-radius: 4px; background: rgba(92,180,138,.18); color: #bfe8d1; }
.rolep.ro { background: rgba(227,163,60,.22); color: #ffd79a; }
.peers { display: inline-flex; align-items: center; gap: 0; } .peers i { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font: 700 11px var(--f-cond); color: #10170f; border: 2px solid var(--bar); margin-left: -6px; overflow: hidden; font-style: normal; }
.peers i:first-child { margin-left: 0; } .peers i img { width: 100%; height: 100%; object-fit: cover; } .peers b { font: 600 11px var(--f-mono); color: var(--bar-ink); margin-left: 4px; } .peers small { color: var(--bar-mut); font-size: 11px; margin-left: 6px; } .peers.alone { color: var(--bar-mut); font-size: 11px; }
.wm-btn.cmt { color: #ffd79a; border-color: rgba(227,163,60,.45); } .wm-btn.cmt .ic { fill: currentColor; }
.reviewstrip { flex: 0 0 auto; padding: 6px 16px; background: color-mix(in srgb, #e3a33c 18%, var(--panel)); border-bottom: 1px solid color-mix(in srgb, #e3a33c 45%, var(--line)); font-size: 12.5px; }
.cmt-mini { border: 1px solid var(--line); background: var(--panel-2); border-radius: 4px; width: 24px; height: 22px; display: grid; place-items: center; cursor: pointer; color: var(--warn); }
.peerdot { width: 15px; height: 15px; border-radius: 50%; display: inline-grid; place-items: center; font: 700 9px var(--f-cond); color: #10170f; font-style: normal; flex: 0 0 auto; }
@media (max-width: 900px) { .peers small, .rolep { display: none; } }
@media (max-width: 1800px) { .peers small { display: none; } .livebar { gap: 6px; } .wm-btn.cmt span, .livebar .wm-btn.cmt { padding: 0 8px; } }
/* self-hosted: user menu, comments */

.um .menu-pop { left: auto; right: 0; min-width: 220px; }
.wm-btn.cmtlist { position: relative; } .wm-btn.cmtlist.on { border-color: var(--acc); color: var(--acc); }
